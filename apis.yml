aid: dunzo
name: Dunzo
description: >-
  Dunzo was an Indian hyperlocal delivery and quick-commerce platform founded in July 2014 in
  Bengaluru by Kabeer Biswas, Ankur Agarwal, Dalvir Suri and Mukund Jha, which grew from a WhatsApp
  group into an app-based service delivering groceries, food, medicines, pet supplies and same-city
  packages across up to nine Indian cities. Its Dunzo for Business (D4B) offering gave merchants
  last-mile delivery through a partner API and through multi-carrier aggregators. Backed by Google,
  Blume Ventures, Alteria Capital and Reliance Retail, the company was dissolved on 14 January 2025;
  the app and website were shut down and every Dunzo-operated host, including its merchant API, is
  now offline. This profile is retained as a historical record — Dunzo publishes no developer
  portal, documentation, specification or support channel today.

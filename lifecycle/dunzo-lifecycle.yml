  note: >-
    Dunzo for Business (D4B) offered merchant API integration for last-mile hyperlocal delivery
    (task creation, delivery quotes, order tracking, webhooks) to partners in up to nine Indian
    cities, and was reachable through third-party multi-carrier aggregators such as ClickPost and
    Shipway. Dunzo never published a public developer portal, OpenAPI/Swagger document, llms.txt or
    any /.well-known/ discovery document — the Internet Archive records only 404s for every
    /.well-known/ path on www.dunzo.com and holds no archived specification. The only archived API
    host, api.dunzo.in, is captured solely as /api/v1/token (HTTP 400) and /robots.txt (404); it no
    longer resolves.

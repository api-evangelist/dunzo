summary: >-
  Dunzo Digital Private Limited ceased operations. The company was dissolved on 2025-01-14 and both
  the consumer app and the dunzo.com website stopped working. Founder and CEO Kabeer Biswas departed
  for Flipkart, and Reliance Retail — which had taken a 25.8% stake for USD 200 million in January
  2022 — wrote off its investment. Every Dunzo-operated host, including the Dunzo for Business
  merchant API surface, is offline; the company publishes no developer portal, documentation,
  specification, status page, changelog or support channel.
